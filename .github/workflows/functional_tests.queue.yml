# This workflow runs functional tests, but only when a PR is added to the merge queue.
# It also can be run manually.

name: Functional tests

on:
  merge_group:
    branches:
      - main
  workflow_dispatch:

jobs:
  functional_tests:
    name: Functional tests
    runs-on: self-hosted

    steps:
      - name: Check out
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@5a7eac68fb9809dea845d802897dc5c723910fa3 # v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: |
          uv sync --group tests
          uv run playwright install

      - name: Run tests
        run: |
          uv run pytest -x --retries 3
        env:
          KAMIHI_TESTING__API_ID: ${{ secrets.API_ID }}
          KAMIHI_TESTING__API_HASH: ${{ secrets.API_HASH }}
          KAMIHI_TESTING__DC_ID: ${{ secrets.DC_ID }}
          KAMIHI_TESTING__DC_IP: ${{ secrets.DC_IP }}
          KAMIHI_TESTING__REDIS__HOST: ${{ secrets.REDIS_HOST }}
          KAMIHI_TESTING__REDIS__PASSWORD: ${{ secrets.REDIS_PASSWORD }}
